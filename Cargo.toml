[package]
name = "nhs-number-cli"
version = "0.2.0"
edition = "2024"
authors = ["Joel Parker Henderson <joel.henderson@wales.nhs.uk>"]
description = "National Health Service (NHS) number for NHS England, NHS Wales, NHS Isle of Man."
license = "MIT OR Apache-2.0 OR GPL-2.0 OR GPL-3.0 OR BSD-3-Clause"
repository = "https://github.com/GIG-Cymru-NHS-Wales/nhs-number-cli-using-rust/"
readme = "README.md"
keywords = ["health", "iechyd", "nhs"]
categories = ["science", "data-structures", "value-formatting"]
include = ["src/**/*", "LICENSE.md", "README.md"]

[dependencies]

# assertables: Runtime reliability checking macros
assertables = "9.9.0"

# clap: Command Line Argument Parser
clap = { version = "4.6.1", features = ["string", "wrap_help"] }

# confy: Boilerplate-free configuration management
confy = "2.0.0"

# log: A Rust library providing a lightweight logging facade
#log = "0.4.29"

# env_logger: A logger that can be configured via environment variables
env_logger = "0.11.10"

# glob: Match file paths against Unix shell style patterns
glob = "0.3.3"

# log: A Rust library providing a lightweight logging facade
log = "0.4.29"

# NHS Number library for parsing, validating, generating testables, etc.
nhs-number = "1.0.0"

# regex: Regular expressions parser, compiler, and executer
regex = "1.12.3"

# rhai: Embedded scripting for Rust
rhai = { version = "1.24.0", features = [ "decimal", "internals", "metadata", "serde", "sync", "unicode-xid-ident" ] } # Embedded scripting for Rust

# quick-xml: High-performance XML reader and writer
#quick-xml = "0.25.0"

# serde: Serialize/deserialize framework
serde = { version = "1.0.228", features = ["derive"] }

# serde_json: serialize/deserialize JavaScript Object Notation
#serde_json = "1.0.149"

# serde_yaml: serialize/deserialize Yet Another Markup Language
serde_yaml = "0.9.34"

# strsim: String similarity metrics
strsim = "0.11.0"

# thiserror: Convenient derive macro for the standard library’s std::error::Error trait.
thiserror = "2.0.18"

# TOML encoder/decoder
toml = { version = "1.1.2", features = ["preserve_order"] } # TOML encoder/decoder

# walkdir: Recursive directory traversal
walkdir = "2.5.0"
