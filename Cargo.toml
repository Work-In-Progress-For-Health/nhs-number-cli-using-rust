[package]
name = "nhs-number-cli"
version = "0.3.0"
edition = "2024"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Command line tool that validates United Kingdom (UK) National Health Service (NHS) Numbers, one per line, from standard input."
license = "MIT OR Apache-2.0 OR GPL-2.0 OR GPL-3.0 OR BSD-3-Clause"
repository = "https://github.com/joelparkerhenderson/nhs-number-cli/"
readme = "README.md"
keywords = ["health", "medical", "identifier", "cli"]
categories = ["science", "data-structures", "value-formatting"]
include = ["src/**/*", "LICENSE.md", "README.md"]

[dependencies]

# assertables: process-aware assertion macros used in #[cfg(test)] blocks.
assertables = "10.0.0"

# clap: command line argument parser.
clap = { version = "4.6.1", features = ["string", "wrap_help"] }

# confy: boilerplate-free TOML configuration loading.
confy = "2.0.0"

# env_logger: routes `log` macros to stderr via the RUST_LOG variable.
env_logger = "0.11.10"

# log: lightweight logging facade. Used via trace!/debug!/info!/warn!/error!.
log = "0.4.29"

# nhs-number: parses NHS Numbers and validates the Modulus 11 check digit.
nhs-number = "1.0.1"

# serde: derives Serialize/Deserialize on Config (required by confy).
serde = { version = "1.0.228", features = ["derive"] }

# thiserror: derives std::error::Error on per-module Error enums.
thiserror = "2.0.18"
